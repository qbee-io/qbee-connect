version: 2
builds:
  - builder: prebuilt
    targets:
      - "darwin_amd64"
      - "darwin_arm64"

    prebuilt:
      path: output/{{ .ProjectName }}_{{ .Os }}_{{ .Arch }}/{{ .ProjectName }}
    binary: bin/{{ .ProjectName }}

app_bundles:
  - icon: darwin/qbee.icns
    bundle: io.qbee.qbee-connect
    extra_files:
      - src: darwin/qbee-macos-volume.icns
        dst: .VolumeIcon.icns
    

dmg:
  - name: "{{ .ProjectName }}_{{ .Version }}_{{ .Arch }}"
    use: appbundle
    replace: true
    mod_timestamp: "{{ .CommitTimestamp }}"
