version: 2
builds:
  - builder: prebuilt
    targets:
      - "darwin_amd64"
      - "darwin_arm64"
      - "windows_amd64"
      - "linux_amd64"

    prebuilt:
      path: output/{{.ProjectName}}_{{ .Os }}_{{ .Arch }}/{{.ProjectName}
    binary: bin/{{.ProjectName}}

msi:
  - name: "{{.ProjectName}}_{{.Version}}_{{.MsiArch}}"
    wxs: ./windows/qbee-connect.wks
    extra_files:
      - windows/qbee.ico
    replace: true
    mod_timestamp: "{{ .CommitTimestamp }}"
    version: v3

app_bundles:
  - icon: darwin/qbee.icns
    bundle: io.qbee.qbee-connect

dmg:
  - name: "{{.ProjectName}}_{{.Arch}}"
    use: appbundle
    replace: true
    mod_timestamp: "{{ .CommitTimestamp }}"
