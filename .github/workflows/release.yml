name: Release Qbee Connect on GitHub

permissions:
  contents: write # needed to write releases
  id-token: write # needed for keyless signing
  attestations: write # needed for provenance

on:
  release:
    types: [prereleased]
  push:
    branches:
      - main

env:
  # VERSION is set to the release tag name, e.g., "1.0.0".
  # VERSION: ${{ github.ref_name }}
  VERSION: 26.9.1

  # BUILD_NUMBER is set to the unique run ID of the workflow.
  BUILD_NUMBER: ${{ github.run_id }}

jobs:
  windows-msi:
    name: Windows Installer (MSI)
    runs-on: windows-2025

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Install stable Go version
        uses: actions/setup-go@v6
        with:
          go-version: stable

      - name: Install Fyne tool
        run: go install fyne.io/tools/cmd/fyne@latest

      # - name: Install WiX Toolset
      #   run: |
      #     dotnet tool install --global wix --version 6.0.2
      #     dotnet add package WixToolset.UI.wixext --version 6.0.2
  
      - name: Build binary
        run: fyne package --release --app-version ${{ env.VERSION }} --app-build ${{ env.BUILD_NUMBER }}

      - name: Build MSI installer
        run: dotnet build windows -c Release -a x64

      - name: Upload MSI to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload ${{ env.VERSION }} windows\bin\Release\qbee-connect.msi --clobber


  macos-dmg:
    name: MacOS Disk Image (DMG)
    runs-on: macos-26
    strategy:
      matrix:
        arch: [amd64, arm64]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Install stable Go version
        uses: actions/setup-go@v6
        with:
          go-version: stable

      - name: Install Fyne tool
        run: go install fyne.io/tools/cmd/fyne@latest

      - name: Install create-dmg tool
        run: brew install create-dmg

      - name: Build binary for ${{ matrix.arch }}
        env:
          GOARCH: ${{ matrix.arch }}
        run: fyne package --release --app-version ${{ env.VERSION }} --app-build ${{ env.BUILD_NUMBER }}

      - name: Sign Certificate
        env:
          TMPDIR: ${{ runner.temp }}

          # MACOS_SIGN_P12 is the base64-encoded .p12 certificate file for Developer ID Application certificate type.
          # The certificate can be created and downloaded from the Apple Developer account, Certificates section.
          MACOS_SIGN_P12: ${{ secrets.MACOS_SIGN_P12 }}

          # MACOS_SIGN_PASSWORD is the password for the .p12 certificate file.
          MACOS_SIGN_PASSWORD: ${{ secrets.MACOS_SIGN_PASSWORD }}

          # APPLE_CODE_NOTARY_EMAIL is the Apple ID used for notarization.
          # The user needs to have App Manager role.
          APPLE_CODE_NOTARY_EMAIL: ${{ secrets.APPLE_CODE_NOTARY_EMAIL }}

          # APPLE_CODE_NOTARY_PASSWORD is the password for the Apple ID used for notarization
          APPLE_CODE_NOTARY_PASSWORD: ${{ secrets.APPLE_CODE_NOTARY_PASSWORD }}

        run: bash ./darwin/create-signed-dmg.sh qbee-connect_${{ matrix.arch }}.dmg

      - name: Upload DMG to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload ${{ env.VERSION }} qbee-connect_${{ matrix.arch }}.dmg --clobber
