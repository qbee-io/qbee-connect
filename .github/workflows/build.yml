jobs:
  build:
    name: build and upload artifacts
    strategy:
      matrix:
        include:
          - os: ubuntu-24.04
            arch: amd64
            target: windows
            cc: x86_64-w64-mingw32-gcc
            ext: .exe
          - os: ubuntu-latest
            arch: amd64
            target: linux
          - os: macos-13
            arch: amd64
            target: darwin
          - os: macos-13
            arch: arm64
            target: darwin

    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Fetch all git tags
        run: git fetch --prune --unshallow --tags
      
      # - name: Set Version
      #   if: ${{ env.VERSION == '' }}
      #   run: |
      #     export VERSION=$(git describe --tags --abbrev=0 --match 'v[0-9]*' | sed 's/^v//')-dev
      #     echo "VERSION=$VERSION" >> $GITHUB_ENV

      - name: installing linux dependencies
        if: startsWith(matrix.os, 'ubuntu-')
        shell: bash
        run: |
          # sudo sed -i 's/^deb/#deb/g' /etc/apt/sources.list.d/microsoft-prod.list
          sudo rm /etc/apt/sources.list.d/microsoft-prod.list
          curl https://packages.microsoft.com/config/ubuntu/24.04/packages-microsoft-prod.deb -o packages-microsoft-prod.deb
          sudo dpkg -i --force-confnew packages-microsoft-prod.deb
          sudo apt update
          sudo apt install -y libgl1-mesa-dev xorg-dev gcc-mingw-w64-x86-64 p7zip
      
      - uses: actions/setup-go@v5
        with:
          go-version: 1.25

      - name: install go dependencies
        shell: bash
        run: |
          go install fyne.io/tools/cmd/fyne@latest

      - name: Set environment variables
        run: |
          echo "CGO_ENABLED=1" >> $GITHUB_ENV
          echo "CC=${{ matrix.cc }}" >> $GITHUB_ENV

      - name: Build binary for ${{ matrix.target }} on ${{ matrix.arch }}
        shell: bash
        run: |
          GOOS=${{ matrix.target }} GOARCH=${{ matrix.arch }} go build -ldflags="-w -s"  -o qbee-connect${{ matrix.ext }} 

      # - name: Package binary for ${{ matrix.target }} on ${{ matrix.arch}}
      #   # We don't need to package for windows since Fyne package generates a similar .exe as go build.
      #   if: matrix.target != 'windows'
      #   shell: bash
      #   run: |
      #     task package
      - name: Rename binary for ${{ matrix.target }} on ${{ matrix.arch }}
        shell: bash
        run: |
          mv ./qbee-connect${{ matrix.ext }} qbee-connect_${{ matrix.target }}_${{ matrix.arch }}${{ matrix.ext }}
          
      - name: Upload qbee-connect binary
        uses: actions/upload-artifact@v4
        with:
          name: qbee-connect_${{ matrix.target }}_${{ matrix.arch }}_bin
          path: |
            qbee-connect_${{ matrix.target }}_${{ matrix.arch }}
            qbee-connect_${{ matrix.target }}_${{ matrix.arch }}.exe
          if-no-files-found: error
          retention-days: 7

      # - name: Upload Package
      #   # We don't need to upload package for windows since we do not package for windows.
      #   if: matrix.target != 'windows'
      #   uses: actions/upload-artifact@v4
      #   with:
      #     name: massastation_${{ matrix.target }}_${{ matrix.arch }}_package
